<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>課程學習平台</title>
    <!-- Tailwind CSS（沿用 CDN 模式） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes fadeInDown {
        from { opacity: 0; transform: translate(-50%, -20px); }
        to { opacity: 1; transform: translate(-50%, 0); }
      }
      @keyframes scaleIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fade-in-down { animation: fadeInDown 0.3s ease-out forwards; }
      .animate-scale-in { animation: scaleIn 0.2s ease-out forwards; }

      /* 學生端顯示老師寫的作業說明（富文本 HTML） */
      .assignment-instructions h2 { font-size: 1.15rem; font-weight: 700; margin: 0.6em 0 0.3em; color: #1e293b; }
      .assignment-instructions h3 { font-size: 1.05rem; font-weight: 700; margin: 0.5em 0 0.25em; color: #1e293b; }
      .assignment-instructions p { margin: 0.4em 0; }
      .assignment-instructions ul { list-style: disc; padding-left: 1.5em; margin: 0.4em 0; }
      .assignment-instructions ol { list-style: decimal; padding-left: 1.5em; margin: 0.4em 0; }
      .assignment-instructions a { color: #4f46e5; text-decoration: underline; }
      .assignment-instructions blockquote { border-left: 3px solid #c7d2fe; padding-left: 0.8em; color: #475569; margin: 0.5em 0; }
      .assignment-instructions code { background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 4px; font-size: 0.9em; }
      .assignment-instructions pre { background: #1e293b; color: #f1f5f9; padding: 0.8em 1em; border-radius: 8px; overflow-x: auto; }
      .assignment-instructions pre code { background: transparent; padding: 0; color: inherit; }
      .assignment-instructions img { max-width: 100%; border-radius: 6px; margin: 0.4em 0; }
      .assignment-instructions strong { font-weight: 700; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
